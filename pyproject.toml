[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-git-commit-generator"
version = "0.2.9"
description = "Generate Conventional Commit messages from staged git changes using local Ollama models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "XBarni999" }
]
keywords = ["git", "commit", "ai", "ollama", "conventional-commits", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git"
]
dependencies = [
  "requests>=2.31.0",
  "prompt-toolkit>=3.0.0"
]

[project.scripts]
ai-commit = "main:main"

[tool.setuptools]
py-modules = ["main", "config"]

